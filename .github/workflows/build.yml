name: Build AGRAM
on: workflow_dispatch

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          if [ -d src ]; then cp -r src/. .; fi
          ls -la
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: pip install flet==1.1.2
      - run: flet build apk --yes
      - uses: actions/upload-artifact@v4
        with: { name: agram-android, path: build/apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        shell: bash
        run: |
          if [ -d src ]; then cp -r src/. .; fi
          ls -la
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: pip install flet==1.1.2
      - run: flet build windows --yes
      - uses: actions/upload-artifact@v4
        with: { name: agram-windows, path: build/windows }
